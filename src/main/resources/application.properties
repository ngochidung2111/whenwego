spring.application.name=wwg

# Load local secrets from .env when present. Environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/whenwego
spring.datasource.username=root
spring.datasource.password=chidung123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SWAGGER / OPENAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SECURITY
#noinspection SpringBootApplicationProperties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}